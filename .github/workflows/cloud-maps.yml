# Cloud-maps CI — the S253 cloud-PA "beachhead" (build-first, lowest-risk seam).
#
# PURPOSE (docs/deep-dives ../scrml-support cloud-pa-gate-offload-2026-07-13 §6/§8 step 1): prove the
#   CLOUD-BOT-WRITES-TO-PROTECTED-MAIN seam + offload the maps/@generated bookkeeping the PA otherwise
#   pays by hand every wrap (maps drift ~130+ commits between manual refreshes).
#
# BRANCH-PROTECTION-AWARE (post-S254): main is protected (enforce_admins), so this NEVER pushes to main
#   directly. It opens a `maps/regen-*` PR and enables auto-merge. `gate` runs on the PR (ci.yml's
#   `pull_request:` trigger has NO path filter → fires on docs-only PRs) and passes (maps/@generated are
#   docs), then auto-merge stamps it (0 required approvals). NO branch-protection bypass — front door only.
#
# WHY A PAT (not default GITHUB_TOKEN): a PR opened by GITHUB_TOKEN does NOT trigger `gate`
#   ("events from GITHUB_TOKEN don't cascade") → auto-merge would wait forever on a gate that never fires.
#   A PAT-opened PR DOES fire gate. Needs a fine-grained PAT (Contents R/W + Pull-requests R/W on this repo)
#   as the `MAPS_PAT` secret.
#   ⚑ S474 (r1/r2): THIS job no longer writes, so it no longer uses MAPS_PAT — it checks out with the
#   default token, read-only, and does NOT go red when MAPS_PAT is missing or expired. The PAT paragraph
#   above is the history of the PR step it used to have; the PAT's live user is generated-regen.yml.
#
# TWO STAGES: (1) deterministic `bun scripts/state.ts --write` (@generated rollup; zero AI cost) then
#   (2) the `project-mapper` agent (committed at .claude/agents/, force-added since .claude/ is gitignored)
#   regenerates .claude/maps/. Claude GitHub App (github.com/apps/claude) must be installed for step 2.
#
# ⚑ S474 — WHAT IS LEFT: Stage 2 was removed at S310 (below). Stage 1 and its PR step were removed at S474:
#   `.github/workflows/generated-regen.yml` now runs `state.ts --write` (with every other derived-block
#   producer) after EVERY merge to main, through one fixed bot branch. A second, daily writer of the same
#   master-list.md block would open a `maps/regen-*` PR that conflicts with the bot's — two writers, the
#   race generated-regen.yml's single-branch design exists to rule out. Only the non-writing Stage 1b
#   thread-board probe remains here.

name: cloud-maps

on:
  workflow_dispatch: {}            # manual — use this to TEST the seam first
  schedule:
    - cron: "17 9 * * *"           # daily ~09:17 UTC — keeps maps ≤24h stale, predictable cost

concurrency:
  group: cloud-maps
  cancel-in-progress: false

permissions:
  contents: read                   # S474: nothing here writes any more (Stage 1 + its PR step moved out)
  # pull-requests: write dropped S474 with the PR step. id-token dropped S310 — it existed solely for the removed claude-code-action Stage 2 (OIDC).

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false         # S474 r1: read-only job — default token, nothing persisted (MAPS_PAT no longer used here)
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # (Stage 1 — `bun scripts/state.ts --write` — moved to generated-regen.yml at S474; see the header.)

      - name: Stage 1b — thread-board probe-health (non-blocking; catches rotted DONE-PROBE fields + prints the board)
        continue-on-error: true
        run: bun scripts/threads.ts --check && bun scripts/threads.ts

      # Stage 2 (nav-map regeneration via the project-mapper agent) was REMOVED 2026-08-01 (S310).
      # It was the only Anthropic-billed step here. bryan ruled the cloud AI spend off — the API key is
      # a COST decision, not a broken secret, so the leg is deleted rather than left erroring red.
      # A permanently-red check is the pa-base §8 cry-wolf shape: it gets ignored, then a real failure
      # gets ignored with it. It was already costing real time — an S310 boot spent part of itself
      # root-causing this workflow's red run.
      #
      # CONSEQUENCE, stated plainly: nav-maps are NO LONGER refreshed on a schedule. That reverts to the
      # PA at wrap (the contract's wrap step 6c), which is where it lived before this workflow existed.
      # (S474: the @generated state rollup is now regenerated after every merge by generated-regen.yml.)
      #
      # TO REINSTATE: restore a `anthropics/claude-code-action@v1` step here with the project-mapper
      # FULL_COLD_START prompt and set the `ANTHROPIC_API_KEY` repo secret.

      # ⚑ S436 — THE LABEL MUST NAME WHAT THE JOB STILL DOES, NOT WHAT IT USED TO.
      # Until S436 the commit/PR below said "scheduled nav-map + @generated regen" and "Automated
      # maps + @generated regen" — eight weeks after Stage 2 was deleted above, i.e. asserting a map
      # regeneration that had not happened since 2026-08-01. That is not cosmetic: the S432 wrap
      # deferred its own wrap-6c on the strength of it ("Maps: not regenerated. The scheduled
      # `cloud-maps` job refreshes them."), S433 then recorded "5+ sessions of map debt", and at
      # S436 the primary map stamp read `787d4cb4` / 2026-09-18 while HEAD was 79 commits and 57
      # changed `compiler/src` files past it, including 14 `compiler/src` files no map indexes at
      # all. pa-base §10: an obligation and the probe that reads it must resolve to the SAME
      # artifact — here the PR's own name was the probe, and it read the wrong artifact.
      # If Stage 2 is ever reinstated, put "maps" back in these two strings in the same change.
      #
      # S474 — the "Open @generated-state PR" step this comment described was REMOVED with Stage 1: with
      # nothing written here, there is nothing to land. The lesson carries over to generated-regen.yml,
      # whose PR title/body name exactly the files it regenerates.
